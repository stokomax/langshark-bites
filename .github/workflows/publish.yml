name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
      - name: Set up Python
        run: uv python install 3.14
      - name: Install dependencies
        run: uv sync --group dev --extra a2a-notifier
      - name: Lint
        run: uv run ruff check
      - name: Type-check (optional)
        continue-on-error: true
        run: uv run mypy src/
      - name: Test
        run: uv run pytest

  publish:
    name: Publish GitHub Release
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Set up Python
        run: uv python install 3.14

      - name: Determine current version
        id: version
        run: |
          CURRENT=$(grep -m1 '^version' pyproject.toml | sed -E 's/.*"([^"]+)".*/\1/')
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"

      - name: Determine previous version (HEAD~1)
        id: prev-version
        run: |
          PREV=$(git show HEAD~1:pyproject.toml 2>/dev/null | grep -m1 '^version' | sed -E 's/.*"([^"]+)".*/\1/' || echo "none")
          echo "previous=$PREV" >> "$GITHUB_OUTPUT"

      - name: Check if version changed
        id: should-publish
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "${{ steps.version.outputs.current }}" != "${{ steps.prev-version.outputs.previous }}" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check if tag already exists
        if: steps.should-publish.outputs.publish == 'true'
        id: tag-check
        run: |
          TAG="v${{ steps.version.outputs.current }}"
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q "$TAG"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build wheel & sdist
        if: steps.should-publish.outputs.publish == 'true' && steps.tag-check.outputs.exists == 'false'
        run: uv build

      - name: Verify artifacts
        if: steps.should-publish.outputs.publish == 'true' && steps.tag-check.outputs.exists == 'false'
        run: ls -la dist/

      - name: Create GitHub Release
        if: steps.should-publish.outputs.publish == 'true' && steps.tag-check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.tag-check.outputs.tag }}" \
            dist/* \
            --repo "${{ github.repository }}" \
            --title "${{ steps.tag-check.outputs.tag }}" \
            --generate-notes
