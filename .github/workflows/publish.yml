name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Set up Python
        run: uv python install 3.14
      - name: Install dependencies
        run: uv sync --group dev --extra a2a-notifier
      - name: Lint
        run: uv run ruff check
      - name: Type-check (optional)
        continue-on-error: true
        run: uv run mypy src/
      - name: Test
        run: uv run pytest

  publish:
    name: Publish to GitHub Packages
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.14

      - name: Determine current version
        id: version
        run: |
          CURRENT=$(grep -m1 '^version' pyproject.toml | sed -E 's/.*"([^"]+)".*/\1/')
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"

      - name: Determine previous version (HEAD~1)
        id: prev-version
        run: |
          PREV=$(git show HEAD~1:pyproject.toml 2>/dev/null | grep -m1 '^version' | sed -E 's/.*"([^"]+)".*/\1/' || echo "none")
          echo "previous=$PREV" >> "$GITHUB_OUTPUT"

      - name: Check if version changed
        id: should-publish
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "${{ steps.version.outputs.current }}" != "${{ steps.prev-version.outputs.previous }}" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build wheel & sdist
        if: steps.should-publish.outputs.publish == 'true'
        run: uv build

      - name: Verify artifacts
        if: steps.should-publish.outputs.publish == 'true'
        run: ls -la dist/

      - name: Publish to GitHub Packages
        if: steps.should-publish.outputs.publish == 'true'
        env:
          UV_PUBLISH_URL: https://pypi.pkg.github.com/stokomax/langshark-bites/
          UV_PUBLISH_USERNAME: ${{ github.actor }}
          UV_PUBLISH_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: uv publish dist/*
