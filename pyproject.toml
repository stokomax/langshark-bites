[project]
name = "langshark-bites"
version = "1.0.0"
description = "Bite-size add-ons and wrappers for building durable and scalable Langchain multi-agent solutions."
readme = "README.md"
requires-python = ">=3.14"
keywords = [
    "langchain",
    "langgraph",
    "multi-agent",
    "agents",
    "rate-limit",
    "circuit-breaker",
    "fallback",
    "redis",
    "llm",
]
dependencies = [
    "structlog>=24.4.0",
    "redis>=5.0.0",
    "pyyaml>=6.0.2",
    "json_repair>=0.3",
    "langchain-core>=1.4.9",
    "pydantic>=2.9.2",
    # Phoenix OTEL client only — NOT the full `arize-phoenix` app SDK.
    #
    # WHY: full `arize-phoenix` drags in pydantic-ai-slim → genai-prices →
    # httpx2.  openai>=2.53 reads `sys.modules["httpx2"]` and assumes it is
    # fully initialized; a concurrent import (e.g. Phoenix init racing a
    # ChatOpenAI/ChatDeepSeek construction) yields:
    #   AttributeError: partially initialized module 'httpx2' ... no attribute 'URL'
    # The Phoenix UI/collector runs as its own service; the agent process only
    # needs `phoenix.otel.register` + `using_attributes`, both provided by
    # arize-phoenix-otel.
    "arize-phoenix-otel>=0.16.1",
    "pyjwt[crypto]>=2.9",
    "httpx",
    "langgraph-sdk>=0.1.50",
    "langchain>=1.4",
]

[project.urls]
Homepage = "https://github.com/stokomax/langshark-bites"
Documentation = "https://stokomax.github.io/langshark-bites/"
Repository = "https://github.com/stokomax/langshark-bites"

[project.optional-dependencies]
a2a-notifier = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # Official A2A protocol types (Task / TaskStatus) for webhook bodies.
    "a2a-sdk>=1.1.0",
    # create_supervisor_tools connects to external MCP servers for LangChain.
    "langchain[mcp]>=1.4",
]

[dependency-groups]
dev = [
    "fakeredis>=2.38.0",
    "pytest>=8.3.3",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.9",
    "mypy",
    "types-PyYAML",
    # The a2a supervisor-tools tests exercise langchain.mcp (fastmcp client).
    "langchain[mcp]>=1.4",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-autorefs>=1.0",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
    # mkdocstrings imports the a2a_completion_notifier submodules to render
    # API docs; receiver.py imports fastapi at module level, so the a2a
    # optional deps must be present in the docs environment too.
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/langshark_bites"]

[tool.hatch.build.targets.sdist]
# Defense-in-depth on top of the VCS-ignored fileset (hatchling's sdist default
# respects .gitignore): never ship tool-local or generated state inside the sdist.
exclude = [
    ".serena",
    ".venv",
    ".pytest_cache",
    ".ruff_cache",
    "site",
    "dist",
    "build",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
target-version = "py314"
src = ["src"]
line-length = 100
# templates/bite/*.py are intentional {{ ... }} substitution placeholders
# (not valid Python until copied and filled in) — never lint them.
extend-exclude = ["templates"]

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "N", "UP", "B", "SIM", "RET", "ARG",
    "PTH", "PL", "ANN", "D", "ERA", "RUF",
    # Retained from the previous ruleset: these already pass everywhere, and
    # FA/TC encode the repo's `from __future__ import annotations` +
    # TYPE_CHECKING-import conventions (see AGENTS.md).
    "C4", "FA", "ISC", "ICN", "TID", "TC", "TD",
    "C90",  # mccabe complexity (C901); max-complexity set below
]
ignore = [
    "D100", "D104",  # no docstrings required on modules/packages
    # RUF022 sorts __all__ isort-style (uppercase names first). The repo
    # convention -- documented in AGENTS.md and enforced by
    # tests/test_package_metadata.py::test_public_api_all_is_sorted -- is
    # case-folded alphabetical, and RUF022 exposes no case-insensitive option,
    # so the two orderings are irreconcilable. The test is the source of truth.
    "RUF022",
    # ANN401: public surfaces duck-type LangGraph / Redis / FastMCP / Phoenix
    # handles (StoreLike, runtime, lg, tracer). Tight Protocols would couple
    # the bite to private SDK shapes; Any is the deliberate boundary type.
    "ANN401",
    # PLC0415: optional extras (jwt, yaml, redis, phoenix, json_repair, mcp)
    # and blockbuster-sensitive prewarms are imported inside the call path so
    # a bare `import langshark_bites` stays light and extra-free.
    "PLC0415",
    # PLW0603: observability keeps a process-wide Phoenix tracer singleton;
    # a module-level global + lock is the intended registration pattern.
    "PLW0603",
]

[tool.ruff.lint.per-file-ignores]
# provider_failover's docstrings carry long, unbreakable markdown URLs
# (each link alone exceeds line-length 100); no real code line is long.
"src/langshark_bites/provider_failover.py" = ["E501"]
# Tests are not a public API: pytest functions/fixtures need no return
# annotations or docstrings, stub classes take deliberately unused args, and
# assertions compare against literal values by design.
"tests/*.py" = [
    "D101", "D102", "D103", "D205", "D209", "D417",
    "E402", "PLC0415", "PLR2004", "N818", "C901",
    "ANN001", "ANN002", "ANN003", "ANN201", "ANN202", "ANN204", "ANN401",
    "ARG001", "ARG002", "ARG005",
]
# Examples are pedagogical scripts, not library surface: inline fakes and
# literal comparisons keep them readable.
"examples/*.py" = [
    "D101", "D103", "D105", "D107", "PLR2004", "PLC0415",
    "ANN001", "ANN201", "ANN202", "ANN204", "ARG001", "ARG002",
]
"main.py" = ["D103", "ANN201"]

[tool.ruff.lint.isort]
known-first-party = ["langshark_bites"]

[tool.ruff.lint.flake8-unused-arguments]
# Framework callbacks (LangChain handlers, Starlette routes) accept **kwargs
# purely to satisfy the contract; the names carry no meaning here.
ignore-variadic-names = true

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
# Factory helpers (create_*_server, attach_receiver_routes, RateLimiter.__init__,
# span invokers) take many injected deps by design; keep a ceiling that still
# flags runaway signatures without forcing kwargs-only refactors on every one.
max-args = 10
max-positional-args = 8
# json_output_parser / receiver notification routing are branchy by nature.
max-branches = 20
max-returns = 10
max-statements = 60

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
strict = true
# disallow_any_explicit is off on purpose: public surfaces duck-type LangGraph /
# Redis / FastMCP / Phoenix handles the same way ruff's ANN401 is ignored. Tight
# Protocols would couple bites to private SDK shapes.

# Optional provider SDKs and MCP packages are soft deps; missing stubs must not
# fail the typecheck of the library itself.
[[tool.mypy.overrides]]
module = [
    "anthropic",
    "anthropic.*",
    "openai",
    "openai.*",
    "json_repair",
    "json_repair.*",
    "mcp",
    "mcp.*",
    "phoenix",
    "phoenix.*",
]
ignore_missing_imports = true
