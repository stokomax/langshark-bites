[project]
name = "langshark-bites"
version = "0.1.0"
description = "Bite-size add-ons and wrappers for building durable and scalable Langchain multi-agent solutions."
readme = "README.md"
requires-python = ">=3.14"
keywords = [
    "langchain",
    "langgraph",
    "multi-agent",
    "agents",
    "rate-limit",
    "circuit-breaker",
    "fallback",
    "redis",
    "llm",
]
dependencies = [
    "structlog>=24.4.0",
    "redis>=5.0.0",
    "pyyaml>=6.0.2",
    "json_repair>=0.3",
    "langchain-core>=1.4.9",
    "pydantic>=2.9.2",
    # Phoenix OTEL client only — NOT the full `arize-phoenix` app SDK.
    #
    # WHY: full `arize-phoenix` drags in pydantic-ai-slim → genai-prices →
    # httpx2.  openai>=2.53 reads `sys.modules["httpx2"]` and assumes it is
    # fully initialized; a concurrent import (e.g. Phoenix init racing a
    # ChatOpenAI/ChatDeepSeek construction) yields:
    #   AttributeError: partially initialized module 'httpx2' ... no attribute 'URL'
    # The Phoenix UI/collector runs as its own service; the agent process only
    # needs `phoenix.otel.register` + `using_attributes`, both provided by
    # arize-phoenix-otel.
    "arize-phoenix-otel>=0.16.1",
]

[project.urls]
Homepage = "https://github.com/stokomax/langshark-bites"
Documentation = "https://stokomax.github.io/langshark-bites/"
Repository = "https://github.com/stokomax/langshark-bites"

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.9",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-autorefs>=1.0",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/langshark_bites"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
target-version = "py314"
src = ["src"]
line-length = 100

[tool.ruff.lint]
select = [
    "F",        # Pyflakes rules
    "W",        # PyCodeStyle warnings
    "E",        # PyCodeStyle errors
    "I",        # Sort imports properly
    "C4",       # Catch incorrect use of comprehensions, dict, list, etc
    "FA",       # Enforce from __future__ import annotations
    "ISC",      # Good use of string concatenation
    "ICN",      # Use common import conventions
    "RET",      # Good return practices
    "SIM",      # Common simplification rules
    "TID",      # Some good import practices
    "TC",       # Enforce importing certain types in a TYPE_CHECKING block
    "TD",       # Be diligent with TODO comments
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["langshark_bites"]
